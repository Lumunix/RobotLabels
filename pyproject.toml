[project]
name = "robotlabels"
version = "0.1.0"
description = "Generate robot floor and tote labels from CSV without BarTender"
authors = [{ name = "Lumunix" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "ppf-datamatrix>=0.2",
]

[project.optional-dependencies]
verify = ["pylibdmtx>=0.1.10"]

[project.scripts]
robotlabels = "robotlabels.cli:main"

[tool.poetry]
packages = [{ include = "robotlabels" }]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
